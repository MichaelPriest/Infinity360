name: INFINITY 360 unified XEX with FFmpeg
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Platform/Xbox360/build-request.txt]

permissions:
  contents: read
concurrency:
  group: ffmpeg-xsdk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ffmpeg-xsdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read dashboard version
        id: version
        run: |
          version="$(python3 Platform/Xbox360/tools/package_alpha.py --version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 cmake ninja-build git glslang-tools ffmpeg
      - name: Pin XSDK and compiler
        run: |
          git clone https://github.com/xenosworks/xsdk.git "$HOME/xsdk"
          git -C "$HOME/xsdk" checkout 74dfcca8d21c5fe83b59079ef0e032e62994c1a2
      - uses: actions/cache@v4
        id: toolchain-cache
        with:
          path: ~/xsdk-gcc
          key: xsdk-gcc-powerpc-74dfcca8-ubuntu-2404-v1
      - name: Build compiler on cache miss
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          cd "$HOME/xsdk"
          PREFIX="$HOME/xsdk-gcc" WORK="$RUNNER_TEMP/xsdk-gcc-work" JOBS=4 bash tools/toolchain/build.sh
      - name: Build XSDK support and shader compiler
        run: |
          cd "$HOME/xsdk"
          make -j4 build/libxsdk.a build/host/libxsc.so
      - name: Pin FFmpeg 7.1.3 source
        run: |
          git clone --depth 1 --branch n7.1.3 https://github.com/FFmpeg/FFmpeg.git "$HOME/ffmpeg"
          test "$(git -C "$HOME/ffmpeg" rev-parse HEAD)" = f46e514491172d15bd74b4abb1814cd2f05a763e
          mkdir -p "$RUNNER_TEMP/ffmpeg-diagnostics"
          git -C "$HOME/ffmpeg" rev-parse HEAD > "$RUNNER_TEMP/ffmpeg-diagnostics/source.txt"
      - name: Compile FFmpeg PowerPC libraries
        shell: bash
        run: |
          set -o pipefail
          FFMPEG_SOURCE="$HOME/ffmpeg" XSDK_ROOT="$HOME/xsdk" XSDK_TOOLCHAIN="$HOME/xsdk-gcc" \
            CLOUD360_FFMPEG_ROOT="$RUNNER_TEMP/ffmpeg-install" FFMPEG_BUILD_DIR="$RUNNER_TEMP/ffmpeg-build" \
            bash IPTV/Cloud360/tools/build_ffmpeg_xsdk.sh 2>&1 | tee "$RUNNER_TEMP/ffmpeg-diagnostics/ffmpeg-build.log"
      - name: Pin TLS and curl ports
        run: |
          git clone https://github.com/xenosworks/mbedtls-xenon.git "$HOME/mbedtls-xenon"
          git -C "$HOME/mbedtls-xenon" checkout 591b04adbec4bc5582649601f4407506a610162b
          git -C "$HOME/mbedtls-xenon" submodule update --init --recursive
          git clone https://github.com/xenosworks/curl-xenon.git "$HOME/curl-xenon"
          git -C "$HOME/curl-xenon" checkout a6b70bd06820e1c625f47fe0e592e08c5daaa6b4
      - name: Pin ZIP installer dependency
        run: |
          git clone https://github.com/richgel999/miniz.git "$HOME/infinity-miniz"
          git -C "$HOME/infinity-miniz" checkout 77d0dce8627735138c51770d1799a1ef48f2117d
      - name: Link experimental menu and diagnostic XEX targets
        shell: bash
        run: |
          set -o pipefail
          cmake -S IPTV/Cloud360/native -B "$RUNNER_TEMP/av-native" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/xsdk/cmake/xsdk.cmake" -DXSDK_TOOLCHAIN="$HOME/xsdk-gcc" \
            -DXSDK_GLSLANG="$(command -v glslangValidator)" \
            -DMBEDTLS_XENON_DIR="$HOME/mbedtls-xenon" -DCURL_XENON_DIR="$HOME/curl-xenon" \
            -DINFINITY_MINIZ_DIR="$HOME/infinity-miniz" \
            -DCLOUD360_CONTAINER_FFMPEG_ROOT="$RUNNER_TEMP/ffmpeg-install" -DINFINITY_EXPERIMENTAL_MENU_FFMPEG=ON \
            -DCLOUD360_WITH_LOGOS=OFF -DCLOUD360_WITH_FFMPEG=OFF -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee "$RUNNER_TEMP/ffmpeg-diagnostics/cmake.log"
          cmake --build "$RUNNER_TEMP/av-native" --parallel 2 --target cloud360_container_probe cloud360_av_probe infinity_menu_preview \
            2>&1 | tee "$RUNNER_TEMP/ffmpeg-diagnostics/xex-link.log"
      - name: Verify XEX2 headers and record hashes
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          with (root/"ffmpeg-diagnostics"/"XEX-SHA256.txt").open("w") as out:
              for name in ("cloud360_container_probe.xex","cloud360_av_probe.xex","infinity_menu_preview.xex"):
                  data=(root/"av-native"/name).read_bytes()
                  assert len(data)>4096 and data[:4]==b"XEX2", name
                  out.write(f"{hashlib.sha256(data).hexdigest()}  {name}\n")
          PY
      - name: Stage candidate with LGPL source and verified relink
        run: |
          python3 IPTV/Cloud360/tools/package_ffmpeg_probe.py \
            --build "$RUNNER_TEMP/av-native" --ffmpeg "$HOME/ffmpeg" \
            --ffbuild "$RUNNER_TEMP/ffmpeg-build" --sdk "$HOME/xsdk" --toolchain "$HOME/xsdk-gcc" \
            --tls "$HOME/mbedtls-xenon" --curl "$HOME/curl-xenon" --miniz "$HOME/infinity-miniz" --repo "$GITHUB_WORKSPACE" \
            --stage "$RUNNER_TEMP/Infinity360-IPTV-FFmpeg-${{ steps.version.outputs.version }}-candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity360-IPTV-FFmpeg-${{ steps.version.outputs.version }}-candidate
          path: ${{ runner.temp }}/Infinity360-IPTV-FFmpeg-${{ steps.version.outputs.version }}-candidate.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload clean installation and corresponding source package
        uses: actions/upload-artifact@v4
        with:
          name: Infinity360-${{ steps.version.outputs.version }}-distribution
          path: |
            ${{ runner.temp }}/Infinity360-${{ steps.version.outputs.version }}-Xbox360.zip
            ${{ runner.temp }}/Infinity360-${{ steps.version.outputs.version }}-Xbox360.zip.sha256
            ${{ runner.temp }}/Infinity360-IPTV-FFmpeg-${{ steps.version.outputs.version }}-candidate.zip
          if-no-files-found: error
          retention-days: 14
      - name: Collect configure and linker diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg-diagnostics"
          for file in "$RUNNER_TEMP/ffmpeg-build/ffbuild/config.log" "$RUNNER_TEMP/ffmpeg-build/ffbuild/config.mak" "$RUNNER_TEMP/ffmpeg-build/config.h"; do
            if [ -f "$file" ]; then cp "$file" "$RUNNER_TEMP/ffmpeg-diagnostics/"; fi
          done
          if [ -x "$HOME/xsdk-gcc/bin/powerpc-xsdk-elf-gcc" ]; then
            "$HOME/xsdk-gcc/bin/powerpc-xsdk-elf-gcc" -v > "$RUNNER_TEMP/ffmpeg-diagnostics/compiler.txt" 2>&1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud360-ffmpeg-xsdk-diagnostics
          path: ${{ runner.temp }}/ffmpeg-diagnostics/
          retention-days: 14
          if-no-files-found: warn

  portable-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run portable regression suite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg openssl libssl-dev
          git clone https://github.com/richgel999/miniz.git "$HOME/infinity-miniz"
          git -C "$HOME/infinity-miniz" checkout 77d0dce8627735138c51770d1799a1ef48f2117d
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DINFINITY_MINIZ_DIR="$HOME/infinity-miniz"
          cmake --build build --parallel 2
          ctest --test-dir build -N | grep -E "Test +#[0-9]+: store_zip"
          ctest --test-dir build -N | grep -E "Test +#[0-9]+: disc_god"
          ctest --test-dir build --output-on-failure

  publish:
    needs: [ffmpeg-xsdk, portable-gate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Infinity360-${{ needs.ffmpeg-xsdk.outputs.version }}-distribution
          path: release
      - name: Publish unified installation and matching LGPL materials
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.ffmpeg-xsdk.outputs.version }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -c "Infinity360-$VERSION-Xbox360.zip.sha256"
          python3 - <<'PY'
          import os, zipfile
          v=os.environ["VERSION"]
          with zipfile.ZipFile(f"Infinity360-{v}-Xbox360.zip") as a, zipfile.ZipFile(f"Infinity360-IPTV-FFmpeg-{v}-candidate.zip") as b:
              assert a.testzip() is None and b.testzip() is None
              assert a.read("default.xex")==b.read("bin/default.xex")
              assert a.read("BUILD-COMMIT.txt").decode().strip()==os.environ["GITHUB_SHA"]
              assert a.read("VERSION.txt").decode().strip()==v
              assert any(n.startswith("sources/ffmpeg-") for n in b.namelist())
              assert "relink/commands.json" in b.namelist()
              assert "Licenses/FFmpeg-LGPL-2.1.txt" in a.namelist()
          PY
          tag="unified-v${VERSION}-${GITHUB_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          gh release create "$tag" "Infinity360-$VERSION-Xbox360.zip" "Infinity360-$VERSION-Xbox360.zip.sha256" "Infinity360-IPTV-FFmpeg-$VERSION-candidate.zip" --target "$GITHUB_SHA" --title "INFINITY 360 V$VERSION — FFmpeg integrado" --prerelease --latest=false --notes "Instalação: ZIP Xbox360, extrair em pasta separada e executar default.xex. O ZIP candidate contém materiais LGPL correspondentes e diagnósticos, não é necessário para instalar. Hardware ainda não homologado. Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
