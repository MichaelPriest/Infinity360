name: Android Screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Android/app/**'
      - 'Android/tools/**'
      - '.github/workflows/android-screenshots.yml'
permissions:
  contents: read
concurrency:
  group: android-screenshots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build debug APK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          cd Android
          gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture the installed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: adb install Android/app/build/outputs/apk/debug/app-debug.apk && python3 Android/tools/capture_screenshots.py "${{ runner.temp }}/android-captures"
      - uses: actions/upload-artifact@v4
        with:
          name: infinity360-android-screenshots
          path: ${{ runner.temp }}/android-captures/*.png
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main'
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: infinity360-android-screenshots
          path: docs/android-screenshots
      - name: Publish only against the captured revision
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::warning::Main advanced; screenshots retained as artifact. Run against current main."
            exit 0
          fi
          python3 Android/tools/publish_gallery.py "$GITHUB_SHA"
          git add README.md docs/android-screenshots
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(android): publish native APK screenshots"
          git push origin HEAD:main
