name: Dashboard native screenshots

on:
  workflow_dispatch:
  # Explicit screenshot requests only; no Xbox executable is built here.
  push:
    branches: [main, feature/profile-social-provider]
    paths: [docs/screenshots/request.txt, docs/screenshots/captions.json, .github/workflows/dashboard-screenshots.yml]

permissions:
  contents: write

concurrency:
  group: dashboard-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile native canvas and validate console navigation
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/infinity-render-logs"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DINFINITY_ENABLE_LUA=ON 2>&1 | tee "$RUNNER_TEMP/infinity-render-logs/configure.log"
          cmake --build build --target console_home_tests social_profile_tests -j2 2>&1 | tee "$RUNNER_TEMP/infinity-render-logs/compile.log"
          ctest --test-dir build -R '^(console_home|social_profile)$' --output-on-failure 2>&1 | tee "$RUNNER_TEMP/infinity-render-logs/tests.log"
      - name: Capture and encode PNG screenshots
        run: |
          set -o pipefail
          build/console_home_tests Platform/Xbox360/Assets/home.tga "$RUNNER_TEMP/infinity-frames" 2>&1 | tee "$RUNNER_TEMP/infinity-render-logs/render.log"
          python3 - <<'PY'
          import os, pathlib, struct, zlib
          frames = pathlib.Path(os.environ["RUNNER_TEMP"]) / "infinity-frames"
          output = pathlib.Path("docs/screenshots")
          output.mkdir(parents=True, exist_ok=True)
          images = sorted(frames.glob("*.ppm"))
          assert len(images) == 98, len(images)
          assert all((frames / name).is_file() for name in ('79-scripts-legendas.ppm', '80-grade-legendas.ppm', '81-lista-legendas.ppm'))
          assert (frames / '78-perfis-home.ppm').is_file()
          assert (frames / '77-permissoes-xbox.ppm').is_file()
          assert (frames / '76-comunicacao-xbox.ppm').is_file()
          assert (frames / '75-avatar-diagnostico.ppm').is_file()
          assert (frames / '74-avatar-perfil-teste.ppm').is_file()
          assert (frames / '73-amigos-xbox.ppm').is_file()
          assert (frames / '72-home-grupos.ppm').is_file()
          assert (frames / '70-perfil-teste.ppm').is_file() and (frames / '71-guia-perfil-teste.ppm').is_file()
          assert (frames / '68-fontes-store.ppm').is_file() and (frames / '69-iptv-moderno.ppm').is_file()
          assert (frames / '65-detalhes-moderno.ppm').is_file() and (frames / '66-store-moderna.ppm').is_file() and (frames / '67-store-produto-moderno.ppm').is_file()
          assert (frames / "54-layout-1.ppm").is_file() and (frames / "62-layout-9.ppm").is_file()
          assert (frames / "63-biblioteca-grade.ppm").is_file() and (frames / "64-biblioteca-filtros.ppm").is_file()
          assert (frames / "53-aparencia.ppm").is_file()
          assert (frames / "52-conquistas-gpd.ppm").is_file()
          assert (frames / "51-perfis-saves.ppm").is_file()
          assert (frames / "50-link-opcoes.ppm").is_file()
          assert (frames / "48-smb.ppm").is_file() and (frames / "49-smb-config.ppm").is_file()
          assert (frames / "47-refrigeracao.ppm").is_file()
          assert (frames / "46-energia.ppm").is_file()
          assert (frames / "42-marcos-locais.ppm").is_file()
          assert (frames / '40-guia-rapido.ppm').is_file() and (frames / '41-guia-edicao.ppm').is_file()
          assert (frames / '36-english.ppm').is_file() and (frames / '37-espanol.ppm').is_file()
          assert (frames / "29-rede-udp.ppm").is_file()
          assert (frames / "28-video-kernel.ppm").is_file()
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind+data)&0xffffffff)
          for image in images:
              magic, size, depth, rgb = image.read_bytes().split(b"\n", 3)
              assert (magic,size,depth)==(b"P6",b"1280 720",b"255")
              assert len(rgb)==1280*720*3
              scan = b"".join(b"\x00"+rgb[i:i+3840] for i in range(0,len(rgb),3840))
              png = b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">IIBBBBB",1280,720,8,2,0,0,0))+chunk(b"IDAT",zlib.compress(scan,9))+chunk(b"IEND",b"")
              (output/(image.stem+".png")).write_bytes(png)
          (output/"source.txt").write_text(os.environ["GITHUB_SHA"]+"\n")
          # Gallery only references images actually produced by this renderer.
          readme=output/"README.md"
          contents=readme.read_text(encoding="utf-8")
          start="<!-- NATIVE-GALLERY-BEGIN -->"
          end="<!-- NATIVE-GALLERY-END -->"
          assert contents.count(start)==1 and contents.count(end)==1
          import json
          groups=json.loads((output/"captions.json").read_text(encoding="utf-8"))
          entries=[entry for group in groups for entry in group["images"]]
          assert len(entries)==len(images)
          assert len({entry["stem"] for entry in entries})==len(images)
          assert {entry["stem"] for entry in entries}=={p.stem for p in images}
          assert all(entry["caption"].strip() for entry in entries)
          sha=os.environ["GITHUB_SHA"]
          lines=[f"**{len(images)} capturas nativas** — commit [{sha[:12]}](https://github.com/MichaelPriest/Infinity360/commit/{sha}).", "", "As legendas descrevem o conteúdo exibido e o modo de acesso. As capturas usam dados de teste; diagnósticos, perfis e integrações indisponíveis não demonstram funcionamento físico.", ""]
          for group in groups:
              lines.extend(["### "+group["title"], "", "| Tela | Tela |", "| --- | --- |"])
              items=group["images"]
              for i in range(0,len(items),2):
                  pair=items[i:i+2]
                  cells=[f"![{item['caption']}]({item['stem']}.png)" for item in pair]
                  labels=["**"+item["caption"]+"**" for item in pair]
                  if len(cells)==1:
                      cells.append("")
                      labels.append("")
                  lines.extend(["| "+" | ".join(cells)+" |", "| "+" | ".join(labels)+" |"])
              lines.append("")
          left,rest=contents.split(start,1)
          _,right=rest.split(end,1)
          readme.write_text(left+start+"\n\n"+"\n".join(lines)+"\n\n"+end+right,encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infinity-render-diagnostics
          path: ${{ runner.temp }}/infinity-render-logs/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: infinity-native-screenshots
          path: docs/screenshots/
      - name: Publish gallery to selected branch without overwriting newer source
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/profile-social-provider'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$GITHUB_SHA" || { echo "::error::Branch advanced during capture; request a fresh gallery for the new source."; exit 1; }
          git commit -m "docs: refresh native dashboard screenshots"
          git push origin "HEAD:$GITHUB_REF_NAME"
