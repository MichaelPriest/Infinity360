name: Android Remote
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Android/**'
      - '.github/workflows/android-remote.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: FTP client host regression
        run: |
          mkdir -p /tmp/infinity-ftp-tests
          javac -d /tmp/infinity-ftp-tests Android/app/src/main/java/com/infinity360/remote/RemoteProtocol.java Android/app/src/main/java/com/infinity360/remote/XboxFtpClient.java Android/tests/XboxFtpClientTest.java
          java -cp /tmp/infinity-ftp-tests com.infinity360.remote.XboxFtpClientTest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug APK
        working-directory: Android
        run: gradle --no-daemon :app:assembleDebug
      - name: Validate APK and record SHA-256
        run: |
          set -euo pipefail
          test -s Android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t Android/app/build/outputs/apk/debug/app-debug.apk
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify Android/app/build/outputs/apk/debug/app-debug.apk
          cp Android/app/build/outputs/apk/debug/app-debug.apk Infinity360-Remote-debug.apk
          sha256sum Infinity360-Remote-debug.apk > Infinity360-Remote-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: infinity360-remote-debug
          path: |
            Infinity360-Remote-debug.apk
            Infinity360-Remote-debug.apk.sha256
          if-no-files-found: error
