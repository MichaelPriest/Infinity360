name: Android Remote
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Android/**'
      - '.github/workflows/android-remote.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: FTP client host regression
        run: |
          mkdir -p /tmp/infinity-ftp-tests
          javac -d /tmp/infinity-ftp-tests Android/app/src/main/java/com/infinity360/remote/RemoteProtocol.java Android/app/src/main/java/com/infinity360/remote/XboxFtpClient.java Android/tests/XboxFtpClientTest.java
          java -cp /tmp/infinity-ftp-tests com.infinity360.remote.XboxFtpClientTest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug APK
        working-directory: Android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: infinity360-remote-debug
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
