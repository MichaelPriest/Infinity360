name: AuroraX Alpha - build and package Xbox 360 XEX

on:
  push:
    branches:
      - main
    paths:
      - Platform/Xbox360/**
      - Source/**
      - Engine/**
      - IPTV/Cloud360/core/**
      - Tests/**
      - CMakeLists.txt
      - .github/workflows/aurorax-alpha-xex.yml
  workflow_dispatch:
    inputs:
      build_xex:
        description: 'Compilar XEX real no runner Windows com XDK licenciado e etiqueta XDK360'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  portable-checks:
    name: Portable tests (do not produce a XEX)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Alpha packaging on test fixtures
        run: python3 -m unittest discover -s Tests -p 'test_package_alpha.py' -v
      - name: Require media regression dependencies
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v openssl >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg openssl
          fi
          ffmpeg -version
          openssl version
      - name: Test Aurora artwork converter
        run: |
          python3 -m venv .art-venv
          .art-venv/bin/python -m pip install 'Pillow>=10,<13'
          .art-venv/bin/python Tests/AuroraArtTests.py
          .art-venv/bin/python Tests/XboxUnityDownloadTests.py
      - name: Compile portable dashboard and console UI
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel 2
      - name: Run portable regression suite (including streaming)
        run: |
          ctest --test-dir build -N | tee build/test-inventory.txt
          grep -Eq 'Test +#[0-9]+: stream_playback' build/test-inventory.txt
          ctest --test-dir build --output-on-failure --output-junit test-results.xml
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuroraX-portable-test-results
          path: |
            build/test-results.xml
            build/test-inventory.txt
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
      - name: Validate native project assets
        run: |
          test -s Platform/Xbox360/Assets/home.tga
          test -s Platform/Xbox360/AuroraX-Xbox360.vcxproj
          test -s Platform/Xbox360/XboxMain.cpp
          test -s Platform/Xbox360/CloudTv.cpp

  build-xex:
    name: Xbox 360 XDK (requires licensed self-hosted runner)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_xex == true }}
    needs: portable-checks
    runs-on: [self-hosted, Windows, XDK360]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build integrated AuroraX with XDK
        shell: cmd
        run: |
          if not defined XEDK exit /b 1
          pushd Platform\Xbox360
          call build-xex.bat
          if errorlevel 1 exit /b 1
          popd
      - name: Package genuine XEX and approved AuroraX art
        shell: cmd
        run: |
          py -3 Platform\Xbox360\tools\package_alpha.py --xex dist\Xbox360\default.xex --art dist\Xbox360\home.tga --out dist\Xbox360\AuroraX-Alpha-0.1.0-Xbox360.zip
      - name: Upload package to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: AuroraX-Alpha-0.1.0-Xbox360
          path: dist/Xbox360/AuroraX-Alpha-0.1.0-Xbox360.zip
          retention-days: 14
          if-no-files-found: error
