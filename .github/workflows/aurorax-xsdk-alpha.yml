name: INFINITY 360 first XEX - XSDK visual alpha

on:
  push:
    branches: [main]
    paths:
      - 'Platform/Xbox360/build-request.txt'
  workflow_dispatch:
    inputs:
      smc_read:
        description: "Experimental SMC read only (artifact, no Release)"
        type: boolean
        default: false
      power_control:
        description: "Experimental console power control (artifact, no Release)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  xsdk-xex:
    name: Cross-compile real PowerPC XEX2 (XSDK)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read dashboard version
        id: version
        run: |
          version="$(python3 Platform/Xbox360/tools/package_alpha.py --version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "INFINITY_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install XSDK dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential bison flex texinfo \
            libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 \
            cmake ninja-build git glslang-tools
      - name: Pin reviewed open-source Xbox 360 XSDK
        run: |
          git clone https://github.com/xenosworks/xsdk.git "$HOME/xsdk"
          git -C "$HOME/xsdk" checkout 74dfcca8d21c5fe83b59079ef0e032e62994c1a2
      - name: Restore PowerPC compiler cache
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ~/xsdk-gcc
          key: xsdk-gcc-powerpc-74dfcca8-ubuntu-2404-v1
      - name: Build cross compiler (cache miss)
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          cd "$HOME/xsdk"
          PREFIX="$HOME/xsdk-gcc" WORK="$RUNNER_TEMP/xsdk-gcc-work" \
            JOBS=4 bash tools/toolchain/build.sh
      - name: Add experimental read-only SMC import
        if: inputs.smc_read
        run: |
          printf '\nxboxkrnl.exe  0x029  HalSendSMCMessage\n' >> "$HOME/xsdk/imports/imports.txt"
      - name: Add experimental kernel power import
        if: inputs.power_control
        run: |
          if ! grep -q 'HalReturnToFirmware' "$HOME/xsdk/imports/imports.txt"; then
            printf '\nxboxkrnl.exe  0x028  HalReturnToFirmware\n' >> "$HOME/xsdk/imports/imports.txt"
          fi
      - name: Compile XSDK support library
        run: |
          cd "$HOME/xsdk"
          make -j4 build/libxsdk.a build/host/libxsc.so
          test -s build/libxsdk.a
      - name: Pin XSDK TLS and HTTP libraries
        run: |
          git clone https://github.com/xenosworks/mbedtls-xenon.git "$HOME/mbedtls-xenon"
          git -C "$HOME/mbedtls-xenon" checkout 591b04adbec4bc5582649601f4407506a610162b
          git -C "$HOME/mbedtls-xenon" submodule update --init --recursive
          git clone https://github.com/xenosworks/curl-xenon.git "$HOME/curl-xenon"
          git -C "$HOME/curl-xenon" checkout a6b70bd06820e1c625f47fe0e592e08c5daaa6b4
      - name: Pin ZIP reader
        run: |
          git clone https://github.com/richgel999/miniz.git "$HOME/infinity-miniz"
          git -C "$HOME/infinity-miniz" checkout 77d0dce8627735138c51770d1799a1ef48f2117d
      - name: Compile isolated INFINITY 360 Alpha and no-GPU probe
        run: |
          cmake -S IPTV/Cloud360/native -B IPTV/Cloud360/native/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/xsdk/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="$HOME/xsdk-gcc" \
            -DXSDK_GLSLANG="$(command -v glslangValidator)" \
            -DMBEDTLS_XENON_DIR="$HOME/mbedtls-xenon" -DCURL_XENON_DIR="$HOME/curl-xenon" \
            -DINFINITY_MINIZ_DIR="$HOME/infinity-miniz" \
            -DCLOUD360_WITH_LOGOS=OFF -DCLOUD360_WITH_FFMPEG=OFF \
            -DINFINITY_EXPERIMENTAL_SMC_READ=${{ inputs.smc_read && 'ON' || 'OFF' }} \
            -DINFINITY_EXPERIMENTAL_POWER=${{ inputs.power_control && 'ON' || 'OFF' }} \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build IPTV/Cloud360/native/build --parallel 2 --target aurorax_alpha cloud360_probe infinity_core_probe infinity_canvas_probe infinity_menu_preview infinity_launch_target
      - name: Verify real XEX2 and publish separate test package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib, os

          base = Path("IPTV/Cloud360/native/build")
          outputs = {
              "default.xex": base / "infinity_menu_preview.xex",
              "aurorax_alpha_probe.xex": base / "aurorax_alpha.xex",
              "aurorax_gpu_probe.xex": base / "cloud360_probe.xex",
              "infinity_core_probe.xex": base / "infinity_core_probe.xex",
              "infinity_canvas_probe.xex": base / "infinity_canvas_probe.xex",
              "infinity_menu_preview.xex": base / "infinity_menu_preview.xex",
              "Games/INFINITY Launch Test/default.xex": base / "infinity_launch_target.xex",
          }
          for title, path in outputs.items():
              raw = path.read_bytes()
              if len(raw) < 4096 or raw[:4] != b"XEX2":
                  raise SystemExit(f"INVALID XEX2: {title}")
          version = os.environ["INFINITY_VERSION"]
          dest = Path(f"IPTV/Cloud360/Infinity360-Alpha-XSDK-{version}.zip")
          note = (
              f"INFINITY 360 XSDK Alpha {version} - experimental hardware preview ONLY\n"
              "This is not the full XDK dashboard nor the finished PDF UI.\n"
              "default.xex now opens the full experimental menu; aurorax_alpha_probe.xex remains the GPU diagnostic. No autoboot.\n"
              "infinity_core_probe.xex checks production C++ code without GPU.\n"
              "Run only from an isolated folder after the no-GPU probe.\n"
              "infinity_canvas_probe.xex is a separate textured GPU experiment.\n"
              "Run it only after both earlier GPU/no-GPU diagnostics pass.\n"
              "infinity_menu_preview.xex uses the full menu with isolated preview data.\n"
              "Optional XEX launch and experimental MPEG-PS playback only after GPU checks pass.\n"
              "Fresh full ZIP: Top Icons, continuous menu, HTTPS Store, XboxUnity, workspace writes, XEX launch, app installer and DVD-to-workspace enabled. See MenuPreview/LEIA-ME-RECURSOS.txt.\n"
              "Requires file writes, exact hostname allowlist infinity360-store-hosts.txt and trusted cacert.pem.\n"
              "Console clock must be correct. HTTPS only; only allowlisted GitHub release asset redirects for packages; SHA-256 verified.\n"
              "Homebrew catalogue: see MenuPreview/FONTES.txt. Some packages need manual installation and owned data.\n"
              "For 1080p output select it in the official Xbox dashboard; the UI framebuffer is 720p scaled by the console.\n"
              "Sistema > DVD > DVD para GOD: select HDD/USB, then press A twice.\n"
              "Requires MenuPreview/enable-dvd-install.txt containing ENABLE-DVD-INSTALL and file writes.\n"
              "Packages are saved under Infinity360Files/PackageLibrary on that device. XAM acceptance is untested.\n"
              "FTP LAN is opt-in: create MenuPreview/enable-ftp.txt containing ENABLE-FTP-LAN.\n"
              "Upload: enable-ftp-upload.txt containing ENABLE-FTP-UPLOAD, press X in Network. ALLO exact size <=32 MiB.\n"
              "Requires enable-file-writes.txt and private credentials in infinity360-ftp.txt (two lines).\n"
              "Use an isolated trusted LAN; FTP credentials are not encrypted. Never forward port 2121.\n"
              "Personal workspace writes enabled in fresh full ZIP; remove enable-file-writes.txt to disable.\n"
              "Write only to MenuPreview/UserFiles or Infinity360Files on HDD/USB. Use disposable test data.\n"
              "Explicit XEX launch enabled in fresh full ZIP; remove enable-xex-launch.txt to disable.\n"
              "First launch Games/INFINITY Launch Test/default.xex from the menu; it only logs and exits.\n"
              "Prior GPU corruption was reported with Cloud360 v0.5.1.\n"
              "DO NOT run 0.5.1. First run the no-GPU probe by itself.\n"
              "Follow docs/GPU-RESTORE-v052.md before opening default.xex.\n"
              "Never overwrite the dashboard currently booting your console.\n"
              "The XEX requires a homebrew-enabled Xbox 360 console.\n"
          )
          playlist = "#EXTM3U\n"
          with ZipFile(dest, "w", ZIP_DEFLATED) as archive:
              for title, path in outputs.items():
                  archive.write(path, title)
              archive.writestr("playlist.m3u", playlist)
              archive.writestr("probe-playlist.m3u", "#EXTM3U\n#EXTINF:-1 group-title=\"TV\",INFINITY Probe\nhttps://example.invalid/probe.m3u8\n")
              archive.write("Platform/Xbox360/Assets/home.tga", "home.tga")
              home = Path(os.environ["HOME"])
              archive.write(home / "mbedtls-xenon/programs/xsdk/cacert.pem", "cacert.pem")
              archive.write(home / "mbedtls-xenon/LICENSE", "Licenses/mbedtls-LICENSE.txt")
              archive.write(home / "curl-xenon/COPYING", "Licenses/curl-COPYING.txt")
              archive.write(home / "infinity-miniz/LICENSE", "Licenses/miniz-LICENSE.txt")
              archive.write("Platform/Xbox360/third_party/jsmn/jsmn.h", "Licenses/jsmn-source-and-license.h")
              archive.write("Platform/Xbox360/third_party/stb/stb_image.h", "Licenses/stb-image-source-and-license.h")
              archive.write("Platform/Xbox360/third_party/pl_mpeg/LICENSE", "Licenses/pl-mpeg-LICENSE.txt")
              archive.writestr("Licenses/miniz-SOURCE.txt", "https://github.com/richgel999/miniz/tree/77d0dce8627735138c51770d1799a1ef48f2117d\n")
              archive.writestr("Licenses/SOURCES.txt", "Mbed TLS: https://github.com/xenosworks/mbedtls-xenon/tree/591b04adbec4bc5582649601f4407506a610162b\nlibcurl: https://github.com/xenosworks/curl-xenon/tree/a6b70bd06820e1c625f47fe0e592e08c5daaa6b4\nCA bundle: Mozilla roots, MPL-2.0; source https://curl.se/docs/caextract.html\n")
              archive.writestr("MenuPreview/infinity-preview.txt", "INFINITY360-XSDK-PREVIEW\n")
              release_defaults = Path("Platform/Xbox360/ReleaseDefaults")
              for name in ("enable-file-writes.txt", "enable-https-store.txt", "enable-store-install.txt", "enable-xboxunity.txt", "enable-xex-launch.txt", "enable-continuous-session.txt", "enable-dvd-install.txt", "aurorax-profile.txt"):
                  archive.write(release_defaults/name, "MenuPreview/"+name)
              archive.write(release_defaults/"README.md", "MenuPreview/LEIA-ME-RECURSOS.txt")
              for filename in ("aurorax-store.tsv", "infinity360-providers.tsv", "infinity360-store-hosts.txt", "FONTES.txt"):
                  archive.write("Platform/Xbox360/StoreDefaults/"+filename, "MenuPreview/"+filename)
              archive.writestr("MenuPreview/UserFiles/", "")
              archive.writestr("MenuPreview/UserFiles/ContentImport/", "")
              archive.writestr("MenuPreview/playlist.m3u", "#EXTM3U\n#EXTINF:-1 group-title=\"TV ao vivo\",Canal demonstrativo\nhttps://example.invalid/test.ts\n")
              # Store defaults are reviewed real homebrew metadata; no demo item.
              archive.writestr("VERSION.txt", version+"\n")
              archive.writestr("BUILD-COMMIT.txt", os.environ["GITHUB_SHA"]+"\n")
              archive.writestr("LEIA-ME-SEGURANCA.txt", note)
              archive.writestr("SHA256SUMS.txt", "".join(
                  f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {title}\n"
                  for title, path in outputs.items()))
          with ZipFile(dest) as archive:
              assert archive.testzip() is None
              assert archive.read("default.xex")[:4] == b"XEX2"
              assert archive.read("MenuPreview/aurorax-profile.txt") == b"J\t1\nG\t0\n"
              for name, value in [["enable-file-writes.txt","ENABLE-FILE-WRITES"],["enable-https-store.txt","ENABLE-HTTPS-STORE"],["enable-store-install.txt","ENABLE-STORE-INSTALL"],["enable-xboxunity.txt","ENABLE-XBOXUNITY"],["enable-xex-launch.txt","ENABLE-XEX-LAUNCH"],["enable-continuous-session.txt","ENABLE-CONTINUOUS-SESSION"],["enable-dvd-install.txt","ENABLE-DVD-INSTALL"]]:
                  assert archive.read("MenuPreview/"+name) == (value+"\n").encode("ascii")
              assert b"xboxunity.net\n" in archive.read("MenuPreview/infinity360-store-hosts.txt")
              for name in ("enable-ftp.txt","enable-ftp-upload.txt","enable-package-launch.txt","enable-content-install.txt","enable-dashboard-update.txt","enable-smb-session.txt"):
                  assert "MenuPreview/"+name not in archive.namelist()
          update = dest.parent / f"Infinity360-Update-XSDK-{version}.pkg"
          with ZipFile(update, "w", ZIP_DEFLATED) as candidate, ZipFile(dest) as original:
              candidate.write(outputs["infinity_menu_preview.xex"], "default.xex")
              for name in original.namelist():
                  if name in ("VERSION.txt", "BUILD-COMMIT.txt", "home.tga", "cacert.pem", "MenuPreview/infinity-preview.txt", "MenuPreview/UserFiles/") or name.startswith("Licenses/"):
                      candidate.writestr(name, original.read(name))
              candidate.writestr("LEIA-ME.txt", "Candidate only. Install separately; do not replace the running dashboard. Boot default.xex from a trusted external file manager. No auto boot.\n")
          with ZipFile(update) as candidate:
              assert candidate.testzip() is None
              assert candidate.read("default.xex")[:4] == b"XEX2"
          raw = update.read_bytes()
          assert 4096 <= len(raw) <= 64*1024*1024
          identity = "infinity-" + os.environ["GITHUB_SHA"][:12]
          (dest.parent / "infinity360-update.tsv").write_text(f"{identity}\t{version}\t{len(raw)}\t{hashlib.sha256(raw).hexdigest()}\n")
          print("Build XEX2 packaged:", dest)
          PY
      - name: Package checksum
        run: |
          cd IPTV/Cloud360
          sha256sum "Infinity360-Alpha-XSDK-$INFINITY_VERSION.zip" > "Infinity360-Alpha-XSDK-$INFINITY_VERSION.zip.sha256"
      - name: Upload actual INFINITY 360 XEX package
        uses: actions/upload-artifact@v4
        with:
          name: Infinity360-Alpha-XSDK-${{ steps.version.outputs.version }}${{ inputs.smc_read && '-SMC-EXP' || '' }}${{ inputs.power_control && '-POWER-EXP' || '' }}
          path: |
            IPTV/Cloud360/Infinity360-Alpha-XSDK-${{ steps.version.outputs.version }}.zip
            IPTV/Cloud360/Infinity360-Alpha-XSDK-${{ steps.version.outputs.version }}.zip.sha256
            IPTV/Cloud360/Infinity360-Update-XSDK-${{ steps.version.outputs.version }}.pkg
            IPTV/Cloud360/infinity360-update.tsv
          retention-days: 14
          if-no-files-found: error

  portable-gate:
    name: Portable regression release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run portable suite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg openssl libssl-dev
          git clone https://github.com/richgel999/miniz.git "$HOME/infinity-miniz"
          git -C "$HOME/infinity-miniz" checkout 77d0dce8627735138c51770d1799a1ef48f2117d
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DINFINITY_MINIZ_DIR="$HOME/infinity-miniz"
          cmake --build build --parallel 2
          ctest --test-dir build -N | grep -E "Test +#[0-9]+: store_zip"
          ctest --test-dir build -N | grep -E "Test +#[0-9]+: disc_god"
          ctest --test-dir build --output-on-failure

  publish-prerelease:
    name: Publish verified XEX package to GitHub Releases
    needs: [xsdk-xex, portable-gate]
    if: ${{ !inputs.smc_read && !inputs.power_control && github.ref == 'refs/heads/main' && needs.xsdk-xex.result == 'success' && needs.portable-gate.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: xsdk-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Infinity360-Alpha-XSDK-${{ needs.xsdk-xex.outputs.version }}
          path: release
      - name: Verify package and publish immutable commit-specific prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INFINITY_VERSION: ${{ needs.xsdk-xex.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c "Infinity360-Alpha-XSDK-$INFINITY_VERSION.zip.sha256"
          python3 - <<'PY'
          from zipfile import ZipFile
          import hashlib, os
          version=os.environ["INFINITY_VERSION"]
          with ZipFile(f"Infinity360-Alpha-XSDK-{version}.zip") as z:
              assert z.read("VERSION.txt").decode().strip()==version
              assert z.read("BUILD-COMMIT.txt").decode().strip()==os.environ["GITHUB_SHA"]
              assert z.testzip() is None
              for line in z.read("SHA256SUMS.txt").decode().splitlines():
                  digest, name = line.split("  ", 1)
                  raw = z.read(name)
                  assert raw[:4] == b"XEX2" and hashlib.sha256(raw).hexdigest() == digest
          PY
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, os
          version=os.environ["INFINITY_VERSION"]
          raw=Path(f"Infinity360-Update-XSDK-{version}.pkg").read_bytes()
          assert Path("infinity360-update.tsv").read_text().strip().split("\t")==["infinity-"+os.environ["GITHUB_SHA"][:12],version,str(len(raw)),hashlib.sha256(raw).hexdigest()]
          with ZipFile(f"Infinity360-Update-XSDK-{version}.pkg") as z, ZipFile(f"Infinity360-Alpha-XSDK-{version}.zip") as full:
              assert z.read("VERSION.txt")==full.read("VERSION.txt")
              assert z.read("BUILD-COMMIT.txt")==full.read("BUILD-COMMIT.txt")
              assert z.testzip() is None
              assert z.read("default.xex")==full.read("infinity_menu_preview.xex")
          PY
          tag="xsdk-v${INFINITY_VERSION}-${GITHUB_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Existing release for this commit; not replacing its assets."
            exit 0
          fi
          cat > notes.md <<EOF
          INFINITY 360 XSDK Alpha V${INFINITY_VERSION} — experimental prerelease.
          
          Cross-compiled PowerPC XEX2 package from commit ${GITHUB_SHA}.
          Package and individual executable checksums verified in CI.
          Not hardware-homologated; do not replace your installed dashboard or enable autoboot.
          Read LEIA-ME-SEGURANCA.txt before testing. XEX launch and file writes are opt-in.
          Sistema > DVD > DVD para GOD converts the mounted DVD directly to a fragmented SVOD package on HDD or USB. The converter reads back and verifies the block hashes before publishing to the game library. DVD Extract, package import and the NXE handoff are available in the same menu. The multidisc selector recognizes both XEX and GOD copies. Tested with synthetic media on the host. Optical-drive operation and XAM mounting and launch still require a console.
          
          Build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh release create "$tag" "Infinity360-Alpha-XSDK-$INFINITY_VERSION.zip" "Infinity360-Alpha-XSDK-$INFINITY_VERSION.zip.sha256" "Infinity360-Update-XSDK-$INFINITY_VERSION.pkg" infinity360-update.tsv \
            --target "$GITHUB_SHA" --title "INFINITY 360 XSDK Alpha V${INFINITY_VERSION} (${GITHUB_SHA:0:7})" \
            --prerelease --latest=false --notes-file notes.md
