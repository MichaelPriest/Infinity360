name: INFINITY 360 first XEX - XSDK visual alpha

on:
  push:
    branches:
      - main
    paths:
      - IPTV/Cloud360/native/aurorax_alpha.c
      - IPTV/Cloud360/native/probe.c
      - IPTV/Cloud360/native/infinity_core_probe.cpp
      - IPTV/Cloud360/native/infinity_canvas_probe.cpp
      - IPTV/Cloud360/native/XsdkDownload.*
      - IPTV/Cloud360/native/infinity_launch_target.c
      - IPTV/Cloud360/native/xsdk_preview_workspace.cpp
      - Platform/Xbox360/**
      - Source/**
      - IPTV/Cloud360/native/infinity_canvas.vert
      - IPTV/Cloud360/native/infinity_canvas.frag
      - Platform/Xbox360/HomeCanvas.*
      - Platform/Xbox360/GlyphWidths.h
      - Platform/Xbox360/Assets/home.tga
      - Platform/Xbox360/MediaUrl.*
      - Platform/Xbox360/TvCatalog.*
      - Source/GameScanner.*
      - IPTV/Cloud360/native/CMakeLists.txt
      - IPTV/Cloud360/core/**
      - .github/workflows/aurorax-xsdk-alpha.yml
      - CMakeLists.txt
      - Tests/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xsdk-xex:
    name: Cross-compile real PowerPC XEX2 (XSDK)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install XSDK dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential bison flex texinfo \
            libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 \
            cmake ninja-build git glslang-tools
      - name: Pin reviewed open-source Xbox 360 XSDK
        run: |
          git clone https://github.com/xenosworks/xsdk.git "$HOME/xsdk"
          git -C "$HOME/xsdk" checkout 74dfcca8d21c5fe83b59079ef0e032e62994c1a2
      - name: Restore PowerPC compiler cache
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ~/xsdk-gcc
          key: xsdk-gcc-powerpc-74dfcca8-ubuntu-2404-v1
      - name: Build cross compiler (cache miss)
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          cd "$HOME/xsdk"
          PREFIX="$HOME/xsdk-gcc" WORK="$RUNNER_TEMP/xsdk-gcc-work" \
            JOBS=4 bash tools/toolchain/build.sh
      - name: Compile XSDK support library
        run: |
          cd "$HOME/xsdk"
          make -j4 build/libxsdk.a build/host/libxsc.so
          test -s build/libxsdk.a
      - name: Pin XSDK TLS and HTTP libraries
        run: |
          git clone https://github.com/xenosworks/mbedtls-xenon.git "$HOME/mbedtls-xenon"
          git -C "$HOME/mbedtls-xenon" checkout 591b04adbec4bc5582649601f4407506a610162b
          git -C "$HOME/mbedtls-xenon" submodule update --init --recursive
          git clone https://github.com/xenosworks/curl-xenon.git "$HOME/curl-xenon"
          git -C "$HOME/curl-xenon" checkout a6b70bd06820e1c625f47fe0e592e08c5daaa6b4
      - name: Pin ZIP reader
        run: |
          git clone https://github.com/richgel999/miniz.git "$HOME/infinity-miniz"
          git -C "$HOME/infinity-miniz" checkout 77d0dce8627735138c51770d1799a1ef48f2117d
      - name: Compile isolated INFINITY 360 Alpha and no-GPU probe
        run: |
          cmake -S IPTV/Cloud360/native -B IPTV/Cloud360/native/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/xsdk/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="$HOME/xsdk-gcc" \
            -DXSDK_GLSLANG="$(command -v glslangValidator)" \
            -DMBEDTLS_XENON_DIR="$HOME/mbedtls-xenon" -DCURL_XENON_DIR="$HOME/curl-xenon" \
            -DINFINITY_MINIZ_DIR="$HOME/infinity-miniz" \
            -DCLOUD360_WITH_LOGOS=OFF -DCLOUD360_WITH_FFMPEG=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build IPTV/Cloud360/native/build --parallel 2 --target aurorax_alpha cloud360_probe infinity_core_probe infinity_canvas_probe infinity_menu_preview infinity_launch_target
      - name: Verify real XEX2 and publish separate test package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib, os

          base = Path("IPTV/Cloud360/native/build")
          outputs = {
              "default.xex": base / "aurorax_alpha.xex",
              "aurorax_gpu_probe.xex": base / "cloud360_probe.xex",
              "infinity_core_probe.xex": base / "infinity_core_probe.xex",
              "infinity_canvas_probe.xex": base / "infinity_canvas_probe.xex",
              "infinity_menu_preview.xex": base / "infinity_menu_preview.xex",
              "Games/INFINITY Launch Test/default.xex": base / "infinity_launch_target.xex",
          }
          for title, path in outputs.items():
              raw = path.read_bytes()
              if len(raw) < 4096 or raw[:4] != b"XEX2":
                  raise SystemExit(f"INVALID XEX2: {title}")
          dest = Path("IPTV/Cloud360/Infinity360-Alpha-XSDK-0.1.8.9.zip")
          note = (
              "INFINITY 360 XSDK Alpha 0.1.8.9 - experimental hardware preview ONLY\n"
              "This is not the full XDK dashboard nor the finished PDF UI.\n"
              "No game launch, no IPTV playback, no themes, no autoboot.\n"
              "infinity_core_probe.xex checks production C++ code without GPU.\n"
              "Run only from an isolated folder after the no-GPU probe.\n"
              "infinity_canvas_probe.xex is a separate textured GPU experiment.\n"
              "Run it only after both earlier GPU/no-GPU diagnostics pass.\n"
              "infinity_menu_preview.xex uses the full menu with isolated preview data.\n"
              "Optional XEX launch only after GPU checks pass; no playback.\n"
              "HTTPS Store opt-in: MenuPreview/enable-https-store.txt containing ENABLE-HTTPS-STORE.\n"
              "Requires file writes, exact hostname allowlist infinity360-store-hosts.txt and trusted cacert.pem.\n"
              "Console clock must be correct. HTTPS only; redirects refused; SHA-256 verified before publication.\n"
              "FTP LAN is opt-in: create MenuPreview/enable-ftp.txt containing ENABLE-FTP-LAN.\n"
              "Upload: enable-ftp-upload.txt containing ENABLE-FTP-UPLOAD, press X in Network. ALLO exact size <=32 MiB.\n"
              "Requires enable-file-writes.txt and private credentials in infinity360-ftp.txt (two lines).\n"
              "Use an isolated trusted LAN; FTP credentials are not encrypted. Never forward port 2121.\n"
              "File writes OFF by default. To opt in create MenuPreview/enable-file-writes.txt containing ENABLE-FILE-WRITES.\n"
              "Write only to MenuPreview/UserFiles or Infinity360Files on HDD/USB. Use disposable test data.\n"
              "To enable, manually create MenuPreview/enable-xex-launch.txt containing ENABLE-XEX-LAUNCH.\n"
              "First launch Games/INFINITY Launch Test/default.xex from the menu; it only logs and exits.\n"
              "Prior GPU corruption was reported with Cloud360 v0.5.1.\n"
              "DO NOT run 0.5.1. First run the no-GPU probe by itself.\n"
              "Follow docs/GPU-RESTORE-v052.md before opening default.xex.\n"
              "Never overwrite the dashboard currently booting your console.\n"
              "The XEX requires a homebrew-enabled Xbox 360 console.\n"
          )
          playlist = "#EXTM3U\n"
          with ZipFile(dest, "w", ZIP_DEFLATED) as archive:
              for title, path in outputs.items():
                  archive.write(path, title)
              archive.writestr("playlist.m3u", playlist)
              archive.writestr("probe-playlist.m3u", "#EXTM3U\n#EXTINF:-1 group-title=\"TV\",INFINITY Probe\nhttps://example.invalid/probe.m3u8\n")
              archive.write("Platform/Xbox360/Assets/home.tga", "home.tga")
              home = Path(os.environ["HOME"])
              archive.write(home / "mbedtls-xenon/programs/xsdk/cacert.pem", "cacert.pem")
              archive.write(home / "mbedtls-xenon/LICENSE", "Licenses/mbedtls-LICENSE.txt")
              archive.write(home / "curl-xenon/COPYING", "Licenses/curl-COPYING.txt")
              archive.write(home / "infinity-miniz/LICENSE", "Licenses/miniz-LICENSE.txt")
              archive.writestr("Licenses/miniz-SOURCE.txt", "https://github.com/richgel999/miniz/tree/77d0dce8627735138c51770d1799a1ef48f2117d\n")
              archive.writestr("Licenses/SOURCES.txt", "Mbed TLS: https://github.com/xenosworks/mbedtls-xenon/tree/591b04adbec4bc5582649601f4407506a610162b\nlibcurl: https://github.com/xenosworks/curl-xenon/tree/a6b70bd06820e1c625f47fe0e592e08c5daaa6b4\nCA bundle: Mozilla roots, MPL-2.0; source https://curl.se/docs/caextract.html\n")
              archive.writestr("MenuPreview/infinity-preview.txt", "INFINITY360-XSDK-PREVIEW\n")
              archive.writestr("MenuPreview/infinity360-providers.tsv", "# id\\tname\\thttps_url\\tbytes\\tsha256\n# Configure only approved authorized catalogs. No live servers preinstalled.\n")
              archive.writestr("MenuPreview/UserFiles/", "")
              archive.writestr("MenuPreview/playlist.m3u", "#EXTM3U\n#EXTINF:-1 group-title=\"TV ao vivo\",Canal demonstrativo\nhttps://example.invalid/test.ts\n")
              archive.writestr("MenuPreview/aurorax-store.tsv", "demo\thomebrew\tDemo Homebrew\t1.0\t1024\t" + "a"*64 + "\thttps://example.invalid/demo.zip\tDemonstracao\n")
              archive.writestr("LEIA-ME-SEGURANCA.txt", note)
              archive.writestr("SHA256SUMS.txt", "".join(
                  f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {title}\n"
                  for title, path in outputs.items()))
          with ZipFile(dest) as archive:
              assert archive.testzip() is None
              assert archive.read("default.xex")[:4] == b"XEX2"
          print("Build XEX2 packaged:", dest)
          PY
      - name: Package checksum
        run: |
          cd IPTV/Cloud360
          sha256sum Infinity360-Alpha-XSDK-0.1.8.9.zip > Infinity360-Alpha-XSDK-0.1.8.9.zip.sha256
      - name: Upload actual INFINITY 360 XEX package
        uses: actions/upload-artifact@v4
        with:
          name: Infinity360-Alpha-XSDK-0.1.8.9
          path: |
            IPTV/Cloud360/Infinity360-Alpha-XSDK-0.1.8.9.zip
            IPTV/Cloud360/Infinity360-Alpha-XSDK-0.1.8.9.zip.sha256
          retention-days: 14
          if-no-files-found: error

  portable-gate:
    name: Portable regression release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run portable suite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg openssl
          git clone https://github.com/richgel999/miniz.git "$HOME/infinity-miniz"
          git -C "$HOME/infinity-miniz" checkout 77d0dce8627735138c51770d1799a1ef48f2117d
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DINFINITY_MINIZ_DIR="$HOME/infinity-miniz"
          cmake --build build --parallel 2
          ctest --test-dir build -N | grep -E "Test +#[0-9]+: store_zip"
          ctest --test-dir build --output-on-failure

  publish-prerelease:
    name: Publish verified XEX package to GitHub Releases
    needs: [xsdk-xex, portable-gate]
    if: github.ref == 'refs/heads/main' && needs.xsdk-xex.result == 'success' && needs.portable-gate.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: xsdk-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Infinity360-Alpha-XSDK-0.1.8.9
          path: release
      - name: Verify package and publish immutable commit-specific prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c Infinity360-Alpha-XSDK-0.1.8.9.zip.sha256
          python3 - <<'PY'
          from zipfile import ZipFile
          import hashlib
          with ZipFile("Infinity360-Alpha-XSDK-0.1.8.9.zip") as z:
              assert z.testzip() is None
              for line in z.read("SHA256SUMS.txt").decode().splitlines():
                  digest, name = line.split("  ", 1)
                  raw = z.read(name)
                  assert raw[:4] == b"XEX2" and hashlib.sha256(raw).hexdigest() == digest
          PY
          tag="xsdk-v0.1.8.9-${GITHUB_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Existing release for this commit; not replacing its assets."
            exit 0
          fi
          cat > notes.md <<EOF
          INFINITY 360 XSDK Alpha 0.1.8.9 — experimental prerelease.
          
          Cross-compiled PowerPC XEX2 package from commit ${GITHUB_SHA}.
          Package and individual executable checksums verified in CI.
          Not hardware-homologated; do not replace your installed dashboard or enable autoboot.
          Read LEIA-ME-SEGURANCA.txt before testing. XEX launch and file writes are opt-in.
          DVD method selector, verified XEX copy with disc identity lock, and explicit normal return to system for manual NXE installation. Authorized XEX/ZIP app installation, reversible uninstall, version backups and manually synced pinned HTTPS provider catalogs. Native GOD conversion, GOD/XBLA launch and IPTV remain pending.
          
          Build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh release create "$tag" Infinity360-Alpha-XSDK-0.1.8.9.zip Infinity360-Alpha-XSDK-0.1.8.9.zip.sha256 \
            --target "$GITHUB_SHA" --title "INFINITY 360 XSDK Alpha 0.1.8.9 (${GITHUB_SHA:0:7})" \
            --prerelease --latest=false --notes-file notes.md
