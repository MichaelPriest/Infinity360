name: Cloud360 legacy XEX v0.5.1 — DISABLED (unsafe display)
on:
  workflow_dispatch:
jobs:
  build-xex:
    # Old v0.5.1 was observed to disturb Aurora display state on real hardware.
    # Keep this legacy job disabled; use the isolated v0.5.2 workflow instead.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source XSDK build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential bison flex texinfo \
            libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 \
            cmake ninja-build git
      - name: Fetch reviewed XSDK source revision
        run: |
          git clone https://github.com/xenosworks/xsdk.git "$HOME/xsdk"
          git -C "$HOME/xsdk" checkout 74dfcca8d21c5fe83b59079ef0e032e62994c1a2
      - name: Build free PowerPC/XSDK toolchain and SDK
        run: |
          cd "$HOME/xsdk"
          PREFIX="$HOME/xsdk-gcc" WORK="$HOME/xsdk-gcc-work" JOBS=3 \
            tools/toolchain/build.sh
          make -j3
      - name: Compile a real Cloud360 XEX (catalog UI, without decoder)
        run: |
          cd IPTV/Cloud360
          CLOUD360_WITH_FFMPEG=OFF CLOUD360_WITH_LOGOS=OFF \
            bash tools/build_xex.sh
          test -s Cloud360-Xbox360-smoke-v0.5.zip
      - name: Publish generated XEX test package
        uses: actions/upload-artifact@v4
        with:
          name: Cloud360-Xbox360-smoke-v0.5
          path: IPTV/Cloud360/Cloud360-Xbox360-smoke-v0.5.zip
          if-no-files-found: error
          retention-days: 7
