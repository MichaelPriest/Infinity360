name: Cloud360 Xbox 360 SAFE graphics diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cloud360-xex-ci
      - feature/cloud360-gpu-safe-v052
    paths:
      - .github/workflows/cloud360-xex-build.yml
      - IPTV/Cloud360/native/**
      - IPTV/Cloud360/tools/build_xex.sh
      - IPTV/Cloud360/tools/package_xex.py

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install XSDK build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential bison flex texinfo \
            libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 \
            cmake ninja-build git
      - name: Pin reviewed XSDK version
        run: |
          git clone https://github.com/xenosworks/xsdk.git "$HOME/xsdk"
          git -C "$HOME/xsdk" checkout 74dfcca8d21c5fe83b59079ef0e032e62994c1a2
      - name: Restore PowerPC cross compiler
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/xsdk-gcc
          key: xsdk-gcc-powerpc-74dfcca8-ubuntu-2404-v1
      - name: Build PowerPC cross compiler when not cached
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd "$HOME/xsdk"
          PREFIX="$HOME/xsdk-gcc" WORK="$RUNNER_TEMP/xsdk-gcc-work" \
            JOBS=4 bash tools/toolchain/build.sh
      - name: Build required XSDK library
        run: |
          cd "$HOME/xsdk"
          make -j4 build/libxsdk.a
          test -s build/libxsdk.a
      - name: Compile Cloud360 no-GPU probe and responsive UI
        run: |
          cd IPTV/Cloud360
          XSDK_ROOT="$HOME/xsdk" XSDK_TOOLCHAIN="$HOME/xsdk-gcc" \
            bash tools/build_xex.sh
      - name: Verify two XEX2 binaries and ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path("IPTV/Cloud360")
          path = root / "Cloud360-Xbox360-SAFE-v0.5.2.zip"
          assert path.is_file()
          with ZipFile(path) as archive:
              assert archive.testzip() is None
              assert {"cloud360_probe.xex", "default.xex", "playlist.m3u",
                      "LEIA-ME-TESTE.txt"} == set(archive.namelist())
              for filename in ("cloud360_probe.xex", "default.xex"):
                  raw = archive.read(filename)
                  assert len(raw) > 4096 and raw[:4] == b"XEX2"
          print("PASS: compiled XEX2 probe and UI included")
          PY
      - name: Publish SAFE test package
        uses: actions/upload-artifact@v4
        with:
          name: Cloud360-Xbox360-SAFE-v0.5.2
          path: IPTV/Cloud360/Cloud360-Xbox360-SAFE-v0.5.2.zip
          retention-days: 7
          if-no-files-found: error
