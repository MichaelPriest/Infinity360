name: Cloud360 IPTV portable + real FFmpeg software decode tests
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'IPTV/Cloud360/**'
      - 'Platform/Xbox360/MediaUrl.*'
      - '.github/workflows/cloud360-catalog.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portable M3U/TS tests
        run: |
          cmake -S IPTV/Cloud360 -B /tmp/cloud360-build
          cmake --build /tmp/cloud360-build --parallel
          ctest --test-dir /tmp/cloud360-build --output-on-failure
      - name: Python tests
        run: python3 -m unittest discover -s IPTV/Cloud360/tests -p "test_*.py" -v
      - name: UI/catalog syntax
        run: |
          node --check IPTV/Cloud360/preview/app.mjs
          node --check IPTV/Cloud360/preview/catalog.mjs
          node --test IPTV/Cloud360/preview/tests/catalog.test.mjs
      - name: Install FFmpeg native development libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libavformat-dev libavcodec-dev libavutil-dev pkg-config
      - name: Create original video/audio test streams
        run: |
          set -eu
          cd IPTV/Cloud360
          mkdir -p fixtures/generated
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=128x72:rate=5" -frames:v 6 -c:v libx264 -pix_fmt yuv420p -preset ultrafast -threads 1 -f h264 fixtures/generated/test.h264
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=128x72:rate=5" -frames:v 6 -c:v mpeg2video -f mpeg2video fixtures/generated/test.mpeg2
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 0.5 -c:a aac -f adts fixtures/generated/test.aac
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 0.5 -c:a libmp3lame -f mp3 fixtures/generated/test.mp3
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 0.5 -c:a ac3 -f ac3 fixtures/generated/test.ac3
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=128x72:rate=5" -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 1 -c:v libx264 -pix_fmt yuv420p -preset ultrafast -threads 1 -c:a aac fixtures/generated/test.mp4
          ffmpeg -hide_banner -loglevel error -y -i fixtures/generated/test.mp4 -c copy -bsf:v h264_mp4toannexb -f mpegts fixtures/generated/test.ts
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=128x72:rate=5" -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 12 -c:v libx264 -g 10 -keyint_min 10 -sc_threshold 0 -pix_fmt yuv420p -preset ultrafast -threads 1 -c:a aac fixtures/generated/long.mp4
          ffmpeg -hide_banner -loglevel error -y -i fixtures/generated/long.mp4 -c copy -bsf:v h264_mp4toannexb -f mpegts fixtures/generated/long.ts
          ffmpeg -hide_banner -loglevel error -y -i fixtures/generated/long.mp4 -c copy -movflags +faststart fixtures/generated/fast.mp4
          mkdir -p fixtures/generated/fmp4
          ffmpeg -hide_banner -loglevel error -y -i fixtures/generated/long.mp4 -c copy -hls_time 2 -hls_playlist_type vod -hls_segment_type fmp4 -hls_segment_filename fixtures/generated/fmp4/seg%d.m4s fixtures/generated/fmp4/index.m3u8
          ffmpeg -hide_banner -loglevel error -y -i fixtures/generated/test.mp4 -c:v copy -c:a libmp3lame -ar 48000 -f mpegts fixtures/generated/audio-mp3.ts
          ffmpeg -hide_banner -loglevel error -y -i fixtures/generated/test.mp4 -c:v copy -c:a ac3 -ar 48000 -f mpegts fixtures/generated/audio-ac3.ts
          ffmpeg -hide_banner -loglevel error -y -i fixtures/generated/long.mp4 -c:v copy -c:a aac -ar 44100 fixtures/generated/rate44100.mp4
          ffmpeg -hide_banner -loglevel error -y -i fixtures/generated/test.mp4 -c:v copy -c:a ac3 -ar 48000 -ac 6 -f mpegts fixtures/generated/audio-51.ts
      - name: Build and run actual libavcodec decoder tests on host
        run: |
          cmake -S IPTV/Cloud360 -B /tmp/cloud360-decode -DCLOUD360_WITH_HOST_FFMPEG=ON
          cmake --build /tmp/cloud360-decode --parallel
          ctest --test-dir /tmp/cloud360-decode --output-on-failure
